<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to XSD Converter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            color: #172337;
        }
        .page-container {
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            width: 100%;
            max-width: 740px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }
        .hero img {
            max-height: 68px;
            width: auto;
            border-radius: 12px;
            background: #f8fafc;
            padding: 8px;
        }
        .hero-text {
            flex: 1;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        p.description {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }
        form {
            display: grid;
            gap: 18px;
        }
        label {
            font-weight: 600;
            color: #0f172a;
        }
        .file-input {
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            background: #f8fafc;
            cursor: pointer;
        }
        input[type="file"] {
            width: 100%;
        }
        .submit-button {
            margin-top: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: #004c93;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease-in-out, transform 0.2s ease;
        }
        .submit-button:hover {
            background: #00356a;
            transform: translateY(-1px);
        }
        .note {
            margin-top: 16px;
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="card">
            <div class="hero">
                <img src="{{ url_for('static', filename='deutsche-boerse-logo.png') }}" alt="Deutsche Börse Logo">
                <div class="hero-text">
                    <h1>Excel to XSD Converter</h1>
                    <p class="description">Upload your Excel file and generate a ready-to-download XSD schema automatically.</p>
                </div>
            </div>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <label for="file">Select Excel file (.xlsx):</label>
                <div class="file-input">
                    <input type="file" name="file" accept=".xlsx" required>
                </div>
                <input class="submit-button" type="submit" value="Upload and Generate XSD">
            </form>
            <p class="note">Supported file type: .xlsx. Your uploaded file is processed locally on the server.</p>
        </div>
    </div>
</body>
</html>
